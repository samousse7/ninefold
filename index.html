/* Layout: a night-sky world behind classic blue RPG menu windows. Phone stacks opponent hand / board / your hand; desktop puts hands beside the board. */
:root{
  --sky-0:#03051a; --sky-1:#0a1145; --sky-2:#1c2c8c;
  --win-top:#3a52c6; --win-bot:#0d1663; --win-edge:#e6eafc; --win-edge-2:#7d8de0; --win-ink:#070c3c;
  --text:#f5f3ec; --muted:#b7bfe4; --dim:rgba(245,243,236,.42);
  --gold:#f0cf78; --gold-hi:#ffeab0; --gold-lo:#9d7426; --crystal:#92e8ff;
  --blue-hi:#9cc6ff; --red-hi:#ff9fb4;
  --good:#8ff0b0; --bad:#ff8c8c;
  --f-logo:"Cinzel Decorative","Cinzel","Trajan Pro",Georgia,serif;
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --spd:1;
  color-scheme:dark;
}
html{background:var(--sky-0)}
body{
  background:
    radial-gradient(90% 55% at 50% -5%,rgba(60,90,220,.55),transparent 70%),
    radial-gradient(60% 40% at 85% 25%,rgba(146,232,255,.10),transparent 70%),
    radial-gradient(70% 50% at 10% 70%,rgba(120,70,200,.16),transparent 70%),
    linear-gradient(180deg,var(--sky-1) 0%,var(--sky-0) 70%) var(--sky-0);
  background-attachment:fixed;
  color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 28px;min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
#scene{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .7s ease;background:#03051a center/cover no-repeat}
#scene::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;
  background:radial-gradient(70% 60% at 50% 50%,rgba(3,5,26,.5),rgba(3,5,26,.2) 75%),linear-gradient(180deg,rgba(3,5,26,.55),rgba(3,5,26,.15) 30%,rgba(3,5,26,.15) 70%,rgba(3,5,26,.6))}
#scene.on{opacity:1}
body.scened .who,body.scened .status,body.scened .mrules,body.scened .mtop .where{text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.8)}

/* Region boards: each region's duels are played on its own material */
.board[class*=" b-"]{--bedge:#e9cf98;--bline:#b48a4e;--bink:#2a1a0c;--cell:rgba(255,236,200,.05);--cedge:rgba(255,226,170,.18);
  border-color:var(--bedge);box-shadow:inset 0 0 0 2px var(--bink),inset 0 0 0 3px var(--bline),inset 0 0 40px rgba(0,0,0,.55),0 12px 34px rgba(0,0,0,.55)}
.board[class*=" b-"] .cell{background:var(--cell);border-color:var(--cedge)}
.board.b-ashgrove-academy{background:repeating-linear-gradient(92deg,rgba(255,220,170,.035) 0 3px,transparent 3px 11px),radial-gradient(circle at 50% 35%,#6b4a2b,#3b2717 80%)}
.board.b-port-ravel{--bedge:#d9b46a;--bline:#7c6a4a;--bink:#141a1d;--cell:rgba(210,235,240,.05);--cedge:rgba(200,230,235,.18);
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 26px),repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 2px,transparent 2px 9px),radial-gradient(circle at 50% 35%,#566468,#262f33 82%)}
.board.b-dustmaw-prison{--bedge:#e6c88f;--bline:#9a7440;--bink:#2a1a08;--cell:rgba(255,230,180,.05);--cedge:rgba(255,220,160,.2);
  background:radial-gradient(rgba(255,230,190,.05) 1px,transparent 1.5px) 0 0/7px 7px,radial-gradient(circle at 50% 35%,#8a6a42,#4a3520 82%)}
.board.b-frostpine-monastery{--bedge:#e4f2fc;--bline:#7f9ab5;--bink:#0e1724;--cell:rgba(220,240,255,.06);--cedge:rgba(210,235,255,.22);
  background:linear-gradient(135deg,rgba(255,255,255,.06),transparent 40%,rgba(255,255,255,.04) 60%,transparent),radial-gradient(circle at 50% 30%,#4a607a,#1c2738 82%)}
.board.b-aurum-the-floating-city{--bedge:#f6d98a;--bline:#a8812f;--bink:#120c1c;--cell:rgba(255,235,190,.045);--cedge:rgba(246,217,138,.22);
  background:linear-gradient(118deg,transparent 30%,rgba(240,207,120,.12) 31%,transparent 33%,transparent 62%,rgba(240,207,120,.08) 63%,transparent 64.5%),radial-gradient(circle at 50% 35%,#3a2e4c,#17111f 82%)}
.board.b-the-shattered-isle{--bedge:#a9dccd;--bline:#4f7d74;--bink:#081314;--cell:rgba(190,240,225,.05);--cedge:rgba(170,225,210,.2);
  background:linear-gradient(155deg,transparent 46%,rgba(0,0,0,.35) 47%,transparent 48.5%),linear-gradient(35deg,transparent 60%,rgba(0,0,0,.3) 61%,transparent 62.5%),radial-gradient(circle at 50% 35%,#2b4b4b,#0f2022 82%)}
.board.b-the-citadel-of-ages{--bedge:#d6c8ff;--bline:#7a64c4;--bink:#0d0820;--cell:rgba(220,210,255,.05);--cedge:rgba(210,195,255,.22);
  background:radial-gradient(rgba(255,255,255,.5) .6px,transparent 1px) 0 0/23px 23px,radial-gradient(rgba(200,190,255,.35) .6px,transparent 1px) 11px 13px/31px 31px,radial-gradient(circle at 50% 35%,#33275e,#120b2a 82%)}
.board.b-boss{box-shadow:inset 0 0 0 2px var(--bink,#070c3c),inset 0 0 0 3px #f0cf78,inset 0 0 40px rgba(0,0,0,.55),0 0 26px rgba(255,190,90,.38),0 12px 34px rgba(0,0,0,.55)}
#scene.boss{filter:brightness(.62) saturate(1.25) sepia(.25) hue-rotate(-12deg) contrast(1.1)}
#scene.boss::after{background:radial-gradient(60% 55% at 50% 50%,rgba(20,5,0,.35),rgba(10,2,0,.75) 80%)}
#scene.boss.own{filter:none}
#scene.boss.own::after{background:radial-gradient(70% 60% at 50% 50%,rgba(3,5,26,.5),rgba(3,5,26,.25) 75%),linear-gradient(180deg,rgba(3,5,26,.6),rgba(3,5,26,.2) 30%,rgba(3,5,26,.2) 70%,rgba(3,5,26,.65))}
#fx{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:980px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
[data-a]{cursor:pointer}
button,[data-a],.cell,.hand{touch-action:manipulation}
button:focus-visible,[data-a]:focus-visible,input:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.sh{text-shadow:1px 1px 0 rgba(0,0,0,.65)}

/* ---------- windows ---------- */
.win{position:relative;background:linear-gradient(180deg,var(--win-top),var(--win-bot));border:2px solid var(--win-edge);border-radius:10px;
  box-shadow:inset 0 0 0 2px var(--win-ink),inset 0 0 0 3px var(--win-edge-2),0 10px 30px rgba(0,0,0,.55);
  padding:14px 16px;text-shadow:1px 1px 0 rgba(0,0,0,.6)}
.win-t{font:700 .78rem/1 var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-hi);margin:0 0 10px}
.stack{display:grid;gap:14px}
h1,h2,h3{text-wrap:balance}
h2.ttl{margin:0;font:700 1.35rem/1.2 var(--f-display);letter-spacing:.04em;color:var(--text)}
h3{margin:0;font:700 1rem/1.2 var(--f-display);color:var(--gold-hi);letter-spacing:.06em}
.sub{color:var(--muted);font-size:.88rem}
.lbl{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}

/* menu list with cursor */
.menu{display:grid;gap:2px}
.mi{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 30px;position:relative;background:none;border:0;border-radius:6px;
  text-align:left;font:700 1.05rem/1.2 var(--f-body);color:var(--text);text-shadow:inherit;width:100%}
.mi::before{content:"";position:absolute;left:9px;top:50%;border-left:10px solid var(--gold-hi);border-top:7px solid transparent;border-bottom:7px solid transparent;
  transform:translate(-4px,-50%);opacity:0;transition:opacity .12s,transform .12s;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.6))}
.mi:hover,.mi:focus-visible{background:rgba(255,255,255,.07);outline:none}
.mi:hover::before,.mi:focus-visible::before,.mi.cur::before{opacity:1;transform:translate(0,-50%)}
.mi[disabled]{color:var(--dim);cursor:default}
.mi[disabled]::before{display:none}
.mi .r{margin-left:auto;color:var(--muted);font-weight:500;font-size:.88rem;font-variant-numeric:tabular-nums;text-align:right}
.mi.danger{color:var(--bad)}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:10px;padding-block:12px 12px}
.brand{display:flex;align-items:center;gap:9px;font:700 1.25rem/1 var(--f-logo);letter-spacing:.06em;color:var(--gold-hi);text-shadow:0 0 12px rgba(146,232,255,.35),1px 1px 0 #000;background:none;border:0;padding:0}
.gem{width:14px;height:22px;clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%);background:linear-gradient(160deg,#f2fdff,var(--crystal) 40%,#3a6ad8 78%,#1c2c8c);flex:none}
.top nav{margin-left:auto;display:flex;gap:2px}
.top nav button{background:none;border:1px solid transparent;border-radius:8px;padding:6px 8px;font-weight:800;font-size:.88rem;color:var(--muted);text-shadow:1px 1px 0 #000}
.top nav button.on{color:var(--gold-hi);border-color:rgba(230,234,252,.35);background:rgba(58,82,198,.35)}
.top nav .cnt{font-weight:500;opacity:.8;font-variant-numeric:tabular-nums}
@media (max-width:430px){.top nav .cnt{display:none}.brand span.wm{display:none}.top nav button{padding:6px 6px;font-size:.84rem}}
.togs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tog{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-items:start;text-align:left;background:rgba(7,12,60,.4);border:1px solid rgba(230,234,252,.25);border-radius:8px;padding:10px 12px;text-shadow:inherit}
.tog .bx{width:18px;height:18px;border:2px solid var(--win-edge-2);border-radius:4px;margin-top:2px;grid-row:span 2;display:grid;place-items:center}
.tog.on{border-color:var(--gold);background:rgba(240,207,120,.12)}
.tog.on .bx{background:var(--gold);border-color:var(--gold)}
.tog.on .bx::after{content:"";width:5px;height:9px;border:solid #2a1c05;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg)}
.tog b{font-weight:800}
.tog .d{font-size:.8rem;color:var(--muted);grid-column:2;line-height:1.35}
.tog[disabled]{opacity:.45;cursor:not-allowed}
.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.dif{display:grid;gap:3px;text-align:left;background:rgba(7,12,60,.4);border:1px solid rgba(230,234,252,.25);border-radius:8px;padding:10px 12px;text-shadow:inherit}
.dif b{font:700 .98rem/1.1 var(--f-display);letter-spacing:.03em}
.dif .d{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dif.on{border-color:var(--gold);background:rgba(240,207,120,.16);box-shadow:0 0 14px rgba(240,207,120,.25)}
.dif.on b{color:var(--gold-hi)}

/* ---------- buttons, chips ---------- */
.btn{border:0;border-radius:8px;padding:10px 18px;font-weight:800;font-size:.95rem;letter-spacing:.03em;
  background:linear-gradient(#ffe6a0,#c9973f);color:#2a1c05;box-shadow:0 2px 0 #6e5220,inset 0 1px 0 rgba(255,255,255,.6);text-shadow:none}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #6e5220}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:rgba(8,12,60,.35);color:var(--text);border:1px solid rgba(230,234,252,.55);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn.danger{background:rgba(8,12,60,.35);border:1px solid var(--bad);color:var(--bad);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-weight:800;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;
  background:rgba(7,12,60,.55);border:1px solid rgba(240,207,120,.45);color:var(--gold-hi);white-space:nowrap;text-shadow:none}
.chip.trade{border-color:rgba(255,159,180,.5);color:var(--red-hi)}

/* ---------- cards ---------- */
.card{position:relative;container-type:inline-size;aspect-ratio:10/11;width:100%;max-width:100%;
  border-radius:9%/8%;background:var(--frame);box-shadow:0 2px 6px rgba(0,0,0,.55);user-select:none;-webkit-user-select:none;
  transition:transform .15s ease,box-shadow .15s ease;text-shadow:none}
.card.t1{--frame:linear-gradient(145deg,#c39a62,#6a4a24)}
.card.t2{--frame:linear-gradient(145deg,#f1f4fa,#7c8696)}
.card.t3{--frame:linear-gradient(145deg,#fff0b0,#b07f22)}
.card.t4{--frame:conic-gradient(from 210deg,#ffd0ee,#a9d6ff,#c9ffd9,#fff0a3,#ffd0ee)}
.card .art{position:absolute;top:3.5%;right:3.5%;bottom:3.5%;left:3.5%;border-radius:7%;overflow:hidden;background:var(--artbg)}
.card.p{--artbg:radial-gradient(circle at 64% 62%,#86bcff 0%,#2a64c9 46%,#0f275a 100%)}
.card.o{--artbg:radial-gradient(circle at 64% 62%,#ffa3b7 0%,#b42a4c 46%,#470a1e 100%)}
.card.n{--artbg:radial-gradient(circle at 64% 62%,#9aa3d8 0%,#3e4790 50%,#151a4a 100%)}
.card .art .pic{position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:var(--pos,50% 40%);background-repeat:no-repeat;z-index:0}
.card.has-pic .art{isolation:isolate}
.card.has-pic .art::after{z-index:2;background:radial-gradient(75% 65% at 0% 0%,rgba(0,0,0,.72),transparent 68%)}
.card.has-pic.p .art::before,.card.has-pic.o .art::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;pointer-events:none;mix-blend-mode:normal;border-radius:inherit}
.card.has-pic.p .art::before{background:none;box-shadow:inset 0 0 0 4px #3d7dff,inset 0 0 0 5px rgba(0,0,0,.35);box-shadow:inset 0 0 0 3.4cqw #3d7dff,inset 0 0 0 calc(3.4cqw + 1px) rgba(0,0,0,.35)}
.card.has-pic.o .art::before{background:none;box-shadow:inset 0 0 0 4px #ff4f75,inset 0 0 0 5px rgba(0,0,0,.35);box-shadow:inset 0 0 0 3.4cqw #ff4f75,inset 0 0 0 calc(3.4cqw + 1px) rgba(0,0,0,.35)}
.card.has-pic .gl{display:none}
.card.has-pic.p{box-shadow:0 0 0 2.5px #4f8dff,0 0 14px rgba(90,150,255,.9),0 2px 6px rgba(0,0,0,.55)}
.card.has-pic.o{box-shadow:0 0 0 2.5px #ff4f75,0 0 14px rgba(255,80,120,.85),0 2px 6px rgba(0,0,0,.55)}
.card .art::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 40%)}
.card.t3 .art::before,.card.t4 .art::before{content:"";position:absolute;top:-30%;right:-30%;bottom:-30%;left:-30%;background:radial-gradient(circle at 64% 62%,rgba(255,255,255,.35),transparent 30%);mix-blend-mode:screen}
.card .gl{position:absolute;right:5%;bottom:3%;font-size:50cqw;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
.card .rk{position:absolute;left:5%;top:4%;width:38%;height:46%;font:800 17cqw/1 var(--f-body);color:#fff;
  text-shadow:0 0 2px #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;font-variant-numeric:tabular-nums}
.card .rk b{position:absolute;width:34.2%;text-align:center}
.card .r0{left:32.9%;top:0}.card .r3{left:0;top:34%}.card .r1{left:65.8%;top:34%}.card .r2{left:32.9%;bottom:0}
.card .el{position:absolute;top:6%;right:7%;font-size:15cqw;font-style:normal;line-height:1;filter:drop-shadow(0 1px 1px #000)}
.card .mod{position:absolute;left:7%;bottom:5%;font:800 13cqw/1 var(--f-body);text-shadow:0 0 2px #000,1px 1px 0 #000}
/* ---------- rarity frames: silver (lv 1-4), gold (lv 5-7), illuminated gold (lv 8-9), illuminated gold with prism gems (lv 10) ---------- */
.card .rk,.card .el,.card .mod{z-index:4}
.card .orn{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:3;border-radius:inherit;background:var(--fimg) center/100% 100% no-repeat}

.card.fr3 .art,.card.fr4 .art{top:6.2%;right:6.2%;bottom:6.2%;left:6.2%;border-radius:6%}

.card.fr4 .orn::after{background-image:linear-gradient(115deg,transparent 36%,rgba(255,170,230,.32) 44%,rgba(170,220,255,.34) 50%,rgba(200,255,210,.3) 56%,transparent 64%)}
@media (prefers-reduced-motion:no-preference){.card.fr3 .orn::after,.card.fr4 .orn::after{animation:holo 5.5s ease-in-out infinite}}
@keyframes holo{0%,35%{background-position:130% 0}75%,100%{background-position:-30% 0}}
.card .mod.up{color:var(--good)}.card .mod.dn{color:var(--bad)}
.card.back{--frame:linear-gradient(145deg,#ffe6a0,#8a6420)}
.card.back .sig{position:absolute;top:3.5%;right:3.5%;bottom:3.5%;left:3.5%;border-radius:7%;
  background:radial-gradient(circle,rgba(255,234,176,.95) 0 3.2cqw,transparent 3.6cqw) center/33.33% 33.33%,
             repeating-linear-gradient(45deg,#1f2b86 0 4cqw,#141d63 4cqw 8cqw)}
.card.ghost{--frame:linear-gradient(145deg,#2c3a8c,#141c58)}
.card.ghost .art{background:#0d1450;display:grid;place-items:center}
.card.ghost .q{font:700 34cqw/1 var(--f-display);color:#26338a}
.card.seen .art{filter:grayscale(1) brightness(.45)}
.card.seen .rk,.card.seen .el{opacity:.35}
.card.preview{opacity:.6}

@keyframes drop{from{transform:translateY(-16%) scale(1.14);opacity:.25}to{transform:none;opacity:1}}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg) scale(1.08)}100%{transform:rotateY(0)}}
.card.placed{animation:drop calc(.34s * var(--spd)) cubic-bezier(.2,.8,.3,1.25)}
.card.flipping{animation:flip calc(.52s * var(--spd)) ease-in-out}

/* ---------- title ---------- */
.title{min-height:calc(100vh - 28px);display:grid;align-content:center;justify-items:center;gap:22px;padding-block:28px;text-align:center}
.emblem{position:relative;width:86px;height:132px;animation:float 7s ease-in-out infinite}
.emblem::before{content:"";position:absolute;top:-60px;right:-60px;bottom:-60px;left:-60px;background:radial-gradient(circle,rgba(146,232,255,.38),transparent 62%)}
.emblem .c{position:absolute;top:0;right:0;bottom:0;left:0;clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%);
  background:linear-gradient(160deg,#ffffff,#bff3ff 22%,var(--crystal) 42%,#3a6ad8 72%,#1c2c8c)}
.emblem .c2{position:absolute;top:0;right:0;bottom:0;left:0;clip-path:polygon(50% 0,50% 100%,0 38%);background:rgba(255,255,255,.28)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.logo{margin:0;font:900 clamp(2.5rem,13vw,4.6rem)/1 var(--f-logo);letter-spacing:.06em;
  background:linear-gradient(180deg,#fffbe8 0%,#ffe6a0 40%,#d29d3e 70%,#8a6420 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(146,232,255,.35)) drop-shadow(0 3px 0 rgba(0,0,0,.6))}
.tag-l{font:500 .82rem/1 var(--f-display);letter-spacing:.42em;text-transform:uppercase;color:var(--muted);margin-top:-8px;padding-left:.42em}
.title .win{width:min(100%,340px);text-align:left}
.title .foot-t{color:var(--dim);font-size:.78rem}

/* ---------- map ---------- */
.hero{display:grid;gap:10px}
.hero h1{margin:0;font:700 1.35rem/1.25 var(--f-display);color:var(--gold-hi);letter-spacing:.03em}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stats div{display:grid}
.stats b{font:700 1.3rem/1.1 var(--f-display)}
.stats span{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(230,234,252,.25)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3a6ad8,var(--crystal))}
.regions{display:grid;gap:16px}
.region{display:grid;gap:10px}
.region.has-bg{position:relative;overflow:hidden}
.region .rbg{position:absolute;top:0;left:0;right:0;height:190px;background:center 45%/cover no-repeat;opacity:.55;pointer-events:none;
  -webkit-mask-image:linear-gradient(#000,#000 35%,transparent);mask-image:linear-gradient(#000,#000 35%,transparent)}
.region.has-bg>*:not(.rbg){position:relative;z-index:1}
.region.has-bg .rh h2,.region.has-bg .rh p{text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.7)}
.region.locked{filter:saturate(.35) brightness(.75)}
.rh{display:flex;gap:12px;align-items:baseline}
.rn{font:700 1.6rem/1 var(--f-display);color:var(--gold);min-width:2.3ch}
.rh h2{margin:0;font:700 1.15rem/1.2 var(--f-display);letter-spacing:.03em}
.rh p{margin:3px 0 0;color:var(--muted);font-size:.9rem;max-width:62ch}
.opps{display:grid}
.opp{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid rgba(230,234,252,.14)}
.opp .pt{font-size:1.8rem;width:2.2rem;text-align:center;flex:none;text-shadow:none}
.oi{flex:1;min-width:0}
.on{font-weight:800}
.boss{font-weight:800;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:#2a1c05;background:var(--gold);padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:2px;text-shadow:none}
.od{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pips{letter-spacing:2px;color:var(--gold)}
.won{color:var(--good)}

/* ---------- pre-duel ---------- */
.foe{display:flex;gap:14px;align-items:center}
.foe .pt{font-size:3rem;flex:none;text-shadow:none}
.pt.has-img{display:inline-block;flex:none;padding:0;margin-left:0;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#05071c;vertical-align:middle;
  box-shadow:0 0 0 2px #c9d2e6,0 0 0 3px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.5)}
.pt.has-img.pt-boss{box-shadow:0 0 0 2px var(--gold),0 0 0 3px rgba(80,50,0,.6),0 0 14px rgba(255,214,110,.45),0 3px 10px rgba(0,0,0,.5)}
.pt.has-img img{display:block;width:100%;height:100%;object-fit:cover}
.opp .pt.has-img{width:2.9rem;height:2.9rem}
.foe .pt.has-img{width:7.5rem;height:7.5rem;border-radius:18px}
.who .pt.has-img{width:1.8rem;height:1.8rem;box-shadow:0 0 0 1.5px #c9d2e6}
.who .pt.has-img.pt-boss{box-shadow:0 0 0 1.5px var(--gold)}
.pt.has-img.xs{width:1.6rem;height:1.6rem;box-shadow:0 0 0 1.5px #c9d2e6;margin-right:4px}
@media (max-width:520px){.foe .pt.has-img{width:5.5rem;height:5.5rem;border-radius:14px}}
.quote{font-style:italic;color:var(--muted);margin:2px 0 0}
.rules{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:7.8rem 1fr;gap:10px;align-items:start;font-size:.92rem}
.rules li .chip{justify-self:start}
@media (max-width:420px){.rules li{grid-template-columns:1fr;gap:4px}}
.mini5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:420px}

/* ---------- match ---------- */
.mtop{display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.mtop .where{margin-left:auto;color:var(--muted);font-size:.8rem;text-align:right;text-shadow:1px 1px 0 #000}
.mbtn{background:linear-gradient(180deg,var(--win-top),var(--win-bot));border:1.5px solid var(--win-edge);border-radius:7px;padding:4px 10px;font-weight:800;font-size:.82rem;text-shadow:1px 1px 0 #000}
.match{display:flex;flex-direction:column;gap:8px;align-items:center}
.side{width:100%;max-width:420px;display:grid;gap:4px}
.who{display:flex;align-items:center;gap:8px;min-height:28px;text-shadow:1px 1px 0 #000}
.who .pt{font-size:1.25rem;text-shadow:none}
.who .nm{font-weight:800;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .dot{width:8px;height:8px;border-radius:50%;background:transparent;flex:none}
.side.active .who .dot{background:var(--gold-hi);box-shadow:0 0 8px var(--gold-hi)}
.who .sc{margin-left:auto;font:700 1.9rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.side.p .sc{color:var(--blue-hi)}.side.o .sc{color:var(--red-hi)}
.hand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.side.o .hand{max-width:310px;width:100%;margin:0 auto}
.slot-empty{aspect-ratio:10/11;border-radius:8px;border:1px dashed rgba(146,232,255,.14)}
.hand .card.can{cursor:pointer}
.hand .card.sel{transform:translateY(-10%);box-shadow:0 0 0 2px var(--gold-hi),0 0 18px rgba(255,234,176,.6)}
.mid{width:100%;display:grid;justify-items:center;gap:6px}
.board-wrap{position:relative;width:min(100%,clamp(250px,calc((100vh - 330px) * .9),460px))}
@supports (height:100dvh){.board-wrap{width:min(100%,clamp(250px,calc((100dvh - 330px) * .9),460px))}}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px;
  background:radial-gradient(circle at 50% 40%,#1c2a86,#0a0f44 75%);border:2px solid var(--win-edge);border-radius:12px;
  box-shadow:inset 0 0 0 2px var(--win-ink),inset 0 0 0 3px var(--win-edge-2),inset 0 0 40px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.5)}
.cell{position:relative;aspect-ratio:10/11;border-radius:8px;background:rgba(146,232,255,.035);border:1px solid rgba(146,232,255,.13);
  perspective:700px;container-type:inline-size;display:grid;place-items:center}
.cell .card{position:absolute;top:0;right:0;bottom:0;left:0;height:100%}
.cell.tg{cursor:pointer;border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(255,234,176,.4),0 0 14px rgba(240,207,120,.3)}
.cell.pend{border-color:var(--gold-hi);box-shadow:0 0 0 2px var(--gold-hi),0 0 18px rgba(255,234,176,.5)}
.cell .cel{font-size:34cqw;line-height:1;opacity:.35}
.cell.has-el{background:radial-gradient(circle,rgba(146,232,255,.12),transparent 70%)}
.cell .hint{position:absolute;right:6%;top:5%;z-index:3;font:800 15cqw/1 var(--f-body);color:var(--gold-hi);text-shadow:0 0 3px #000,1px 1px 0 #000}
.status{font-size:.88rem;color:var(--muted);min-height:1.4em;text-align:center;text-shadow:1px 1px 0 #000}
.status b{color:var(--text)}
.mrules{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.banner{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;pointer-events:none;z-index:5}
.banner span{font:900 clamp(2.1rem,11vw,3.4rem)/1 var(--f-logo);color:var(--gold-hi);letter-spacing:.06em;
  text-shadow:0 0 18px rgba(146,232,255,.8),0 3px 0 #2a1c05,0 0 2px #000;animation:pop calc(.9s * var(--spd) + .15s) ease-out forwards}
@keyframes pop{0%{transform:scale(.6);opacity:0}25%{transform:scale(1.08);opacity:1}70%{opacity:1}100%{transform:scale(1);opacity:0}}

@media (min-width:880px){
  .match{display:grid;grid-template-columns:132px minmax(0,500px) 132px;justify-content:center;align-items:start;gap:28px}
  .side{max-width:none}
  .side.o{order:0}.mid{order:1}.side.p{order:2}
  .side.o .hand,.hand{grid-template-columns:1fr;gap:0;max-width:none}
  .hand>*+*{margin-top:-46%}
  .slot-empty{display:none}
  .side.p .hand .card.sel{transform:translateX(-14%)}
  .side.o .hand .card.sel{transform:translateX(14%)}
  .hand .card.can:hover{transform:translateX(-7%)}
  .board-wrap{width:min(100%,clamp(300px,calc((100vh - 170px) * .9),500px))}
  .who{flex-wrap:wrap;row-gap:2px}
  .who .nm{flex:1 1 0;min-width:0;white-space:normal;line-height:1.1;font-size:.85rem}
  .who .sc{flex-basis:100%;text-align:right}
}

/* ---------- overlay ---------- */
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(2,4,20,.78);display:flex;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{margin:auto;width:min(100%,540px);box-sizing:border-box;display:grid;gap:14px}
.verdict{font:900 2.5rem/1 var(--f-logo);text-align:center;letter-spacing:.04em}

const NBT=[];for(let i=0;i<9;i++)NBT.push([i>=3?i-3:-1,i%3<2?i+1:-1,i<6?i+3:-1,i%3>0?i-1:-1]);
function val(st,i,d){const c=st.board[i],card=CARDS[c.inst.cid];let v=card.r[d];const e=st.els[i];if(e)v+=card.e===e?1:-1;return v;}
function basic(ns,i,who){

    if(val(ns,i,d)>val(ns,n,(d+2)%4)){ns.board[n]={inst:nc.inst,owner:who};got.push(n);}}

}
function apply(st,h,c,R,ev){
  const who=st.turn,opp=who==="p"?"o":"p";
  const ns={board:st.board.slice(),els:st.els,hands:{p:st.hands.p.slice(),o:st.hands.o.slice()},turn:opp};
  const inst=ns.hands[who].splice(h,1)[0];
  ns.board[c]={inst,owner:who};
  const flip=n=>{ns.board[n]={inst:ns.board[n].inst,owner:who};};
  if(R.same||R.plus){
    const myR=CARDS[inst.cid].r,info=[];
    for(let d=0;d<4;d++){const n=NBT[c][d];
      if(n<0){if(R.same&&R.wall)info.push({n:-1,my:myR[d],th:10,wall:true});continue;}
      const nc=ns.board[n];if(!nc)continue;info.push({n,my:myR[d],th:CARDS[nc.inst.cid].r[(d+2)%4],wall:false});}
    const got=[];
    if(R.same){const m=info.filter(x=>x.my===x.th);
      if(m.length>=2){const f=m.filter(x=>!x.wall&&ns.board[x.n].owner===opp).map(x=>x.n);
        if(f.length){f.forEach(flip);got.push(...f);ev&&ev.push({k:"same",cells:f});}}}
    if(R.plus){const nw=info.filter(x=>!x.wall),f=[];
      for(let a=0;a<nw.length;a++)for(let b=a+1;b<nw.length;b++){
        if(nw[a].my+nw[a].th===nw[b].my+nw[b].th){[nw[a],nw[b]].forEach(x=>{if(ns.board[x.n].owner===opp&&!f.includes(x.n))f.push(x.n);});}}
      if(f.length){f.forEach(flip);got.push(...f);ev&&ev.push({k:"plus",cells:f});}}
    const q=R.combo?got.slice():[];
    while(q.length){const x=q.shift();const g=basic(ns,x,who);if(g.length){ev&&ev.push({k:"combo",cells:g});q.push(...g);}}
  }
  const b=basic(ns,c,who);if(b.length&&ev)ev.push({k:"basic",cells:b});

}
const full=st=>st.board.every(Boolean);
function score(st,w){let s=st.hands[w].length;for(const c of st.board)if(c&&c.owner===w)s++;return s;}
function evalFor(st,w){
  const o=w==="p"?"o":"p";const s=score(st,w)-score(st,o);
  if(full(st))return s*100;
  let e=0;
  for(let i=0;i<9;i++){const c=st.board[i];if(!c)continue;const sg=c.owner===w?1:-1;
    for(let d=0;d<4;d++){const n=NBT[i][d];if(n>=0&&!st.board[n])e+=sg*(val(st,i,d)-5)*.45;}}
  return s*10+e;
}
function moves(st){
  const hand=st.hands[st.turn],seen={},hs=[];
  hand.forEach((x,k)=>{if(!seen[x.cid]){seen[x.cid]=1;hs.push(k);}});
  const out=[];for(const h of hs)for(let c=0;c<9;c++)if(!st.board[c])out.push({h,c});
  return out;
}
function negamax(st,depth,alpha,beta,R){
  if(depth===0||full(st))return evalFor(st,st.turn);
  let best=-Infinity;
  for(const m of moves(st)){
    const v=-negamax(apply(st,m.h,m.c,R),depth-1,-beta,-alpha,R);
    if(v>best)best=v;if(v>alpha)alpha=v;if(alpha>=beta)break;
  }
  return best;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function aiChoose(st,lvl,R){
  const who=st.turn;
  const mv=shuffle(moves(st)).map(m=>({m,v:evalFor(apply(st,m.h,m.c,R),who)})).sort((a,b)=>b.v-a.v);
  if(lvl===1){return Math.random()<.5?mv[ri(mv.length)].m:mv[ri(Math.min(3,mv.length))].m;}
  if(lvl===2){return(Math.random()<.22&&mv[1])?mv[1].m:mv[0].m;}
  const empty=st.board.filter(x=>!x).length;
  const depth=lvl===3?2:(empty<=6?empty:3);
  let best=-Infinity,bm=mv[0].m,alpha=-Infinity;
  for(const {m} of mv){
    const v=-negamax(apply(st,m.h,m.c,R),depth-1,-Infinity,-alpha,R);
    if(v>best){best=v;bm=m;}if(v>alpha)alpha=v;
  }
  return bm;
}

function normalize(s){
  s.stats=Object.assign({w:0,l:0,d:0,streak:0,best:0,fw:0,fl:0,gilTotal:0},s.stats||{});
  if(typeof s.gil!=="number")s.gil=100;s.xp=s.xp||0;s.lv=s.lv||1;
  if(s.merch&&!Array.isArray(s.merch.ids))s.merch=null;

function addCards(ids){const fresh=[];ids.forEach(id=>{if(!save.col[id]&&!fresh.includes(id))fresh.push(id);save.col[id]=(save.col[id]||0)+1;save.seen[id]=1;});return fresh;}
function openPack(p){const ids=[];for(let i=0;i<p.count;i++)ids.push(randLv(pickW(p.lv)));return ids;}
function genMerch(){
  const br=[[1,4],[1,4],[3,6],[4,7],[6,9],[8,10]];
  if(has("stock"))br.splice(3,0,[2,5],[7,10]);
  const ids=[];for(const [a,b] of br){let id,g=0;do{id=randLv(a+ri(b-a+1));}while(ids.includes(id)&&g++<30);ids.push(id);}
  if(has("legend"))ids[ids.length-1]=randLv(10);
  ids.sort((a,b)=>CARDS[a].lv-CARDS[b].lv||a-b);
  save.merch={ids,sold:ids.map(()=>false)};
}
/* Rewards scale with the opponent's card levels, the number of rules and the winning margin. */
function battleRewards(m,res){
  if(res.forfeit)return {gil:0,xp:0};
  const avg=(m.opp.lv[0]+m.opp.lv[1])/2,margin=Math.min(9,Math.abs(res.sp-res.so));
  const nRules=Object.keys(m.rules).filter(k=>k!=="combo").length;
  let gil=20+16*avg,xp=20+14*avg+4*nRules;
  if(res.winner==="p"){gil+=5*margin;xp+=8*margin;if(m.opp.boss){gil*=2;xp*=1.5;}}
  else if(res.winner===null){gil*=.3;xp*=.4;}
  else{gil*=.1;xp*=.25;}
  return {gil:Math.round(gil*gilMult()),xp:Math.round(xp)};
}
function gainXP(xp){
  const ups=[];if(save.lv>=MAX_LV)return ups;
  save.xp+=xp;
  while(save.lv<MAX_LV&&save.xp>=xpNeed(save.lv)){
    save.xp-=xpNeed(save.lv);save.lv++;
    const L=save.lv,gil=50+25*L;
    const pack=L===MAX_LV?PACKS[3]:L%5===0?PACKS[2]:L>=8?PACKS[1]:PACKS[0];
    const cards=openPack(pack),fresh=addCards(cards);
    save.gil+=gil;save.stats.gilTotal=(save.stats.gilTotal||0)+gil;
    ups.push({lv:L,gil,pack:pack.n,cards,fresh,perk:PERKS.find(p=>p.lv===L)||null,rank:L>1&&RANKS.some(r=>r[0]===L)?rankOf(L):null});
  }
  if(save.lv>=MAX_LV)save.xp=0;
  return ups;
}

function tone(f,t0,dur,type="sine",vol=.1){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+t0;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);}
const sfx={

/* ================= MUSIC =================
   Tracks live in the music folder. A missing file is simply skipped:
   boss falls back to the region track, and a region falls back to the title track. */
const MUSIC_FILES={
  title:"title.mp3",
  r0:"ashgrove.mp3", r1:"port-ravel.mp3", r2:"dustmaw.mp3", r3:"frostpine.mp3",
  r4:"aurum.mp3", r5:"shattered-isle.mp3", r6:"citadel.mp3",
  boss:"boss.mp3", victory:"victory.mp3", defeat:"defeat.mp3"
};
const MUSIC_VOL={high:.55,mid:.35,low:.18,off:0};
const Music={
  ctx:null,cur:null,want:null,missing:{},els:{},unlocked:false,jingleFor:null,FADE:1.2,TAIL:2.5,
  vol(){return MUSIC_VOL[opt().music]??MUSIC_VOL.mid;},
  ensureCtx(){
    if(this.ctx)return this.ctx;
    try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){this.ctx=null;}
    return this.ctx;
  },
  el(key){
    if(this.els[key])return this.els[key];
    const a=new Audio();a.src="music/"+MUSIC_FILES[key];a.preload="auto";a.crossOrigin="anonymous";
    const rec={a,g:null,key,fading:false};
    a.addEventListener("error",()=>{this.missing[key]=1;if(this.cur===rec){this.cur=null;}this.update();});
    if(key!=="victory"&&key!=="defeat"){
      a.addEventListener("timeupdate",()=>{
        if(this.cur!==rec||rec.fading||!a.duration||!isFinite(a.duration))return;
        if(a.duration-a.currentTime<this.TAIL){rec.fading=true;this.ramp(rec,0,this.TAIL*.9);}
      });
      a.addEventListener("ended",()=>{if(this.cur!==rec)return;rec.fading=false;a.currentTime=0;this.ramp(rec,0,0);a.play().catch(()=>{});this.ramp(rec,this.vol(),this.FADE);});
    }
    const c=this.ensureCtx();
    if(c){try{const src=c.createMediaElementSource(a);rec.g=c.createGain();rec.g.gain.value=0;src.connect(rec.g);rec.g.connect(c.destination);}catch(e){rec.g=null;}}
    if(!rec.g)a.volume=0;
    this.els[key]=rec;return rec;
  },
  ramp(rec,to,secs){
    if(rec.g&&this.ctx){const g=rec.g.gain,t=this.ctx.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(to,t+Math.max(.01,secs));}
    else{const a=rec.a,from=a.volume,start=performance.now();const step=()=>{const k=Math.min(1,(performance.now()-start)/(secs*1000||1));a.volume=Math.max(0,Math.min(1,from+(to-from)*k));if(k<1)requestAnimationFrame(step);};step();}
  },
  pick(){
    // which track should be playing right now
    let k="title";
    if(view==="pre"&&preOpp&&OPP[preOpp])k="r"+OPP[preOpp].region;
    if(view==="match"&&match){
      if(match.phase==="done"&&match.result){
        const w=match.result.winner;
        if(this.jingleFor!==match.result){this.jingleFor=match.result;const j=w==="p"?"victory":w==="o"?"defeat":null;if(j&&!this.missing[j])return {jingle:j};}
        k=null;
      }else if(match.free)k="title";
      else{k="r"+match.opp.region;if(match.opp.boss&&!this.missing.boss)k="boss";}
    }
    while(k&&this.missing[k])k=(k==="boss"&&match&&!match.free)?"r"+match.opp.region:(k==="title"?null:"title");
    return {track:k};
  },
  update(){
    if(!this.unlocked)return;
    const v=this.vol();
    if(v===0){if(this.cur){const r=this.cur;this.ramp(r,0,.4);setTimeout(()=>r.a.pause(),450);this.cur=null;}this.want=null;return;}
    const p=this.pick();
    if(p.jingle){this.switchTo(null,.6);const r=this.el(p.jingle);r.a.currentTime=0;this.ramp(r,0,0);r.a.play().catch(()=>{});this.ramp(r,v,.05);return;}
    if(p.track===undefined)return;
    if(p.track===null){if(view!=="match")this.switchTo(null,this.FADE);return;}
    if(this.cur&&this.cur.key===p.track){if(!this.cur.fading)this.ramp(this.cur,v,.3);return;}
    this.switchTo(p.track,this.FADE);
  },
  switchTo(key,secs){
    const old=this.cur;
    if(old){this.ramp(old,0,secs);setTimeout(()=>{if(this.cur!==old)old.a.pause();},secs*1000+80);}
    this.cur=null;
    if(!key)return;
    const r=this.el(key);r.fading=false;this.cur=r;
    if(r.a.ended||r.a.currentTime>0&&r.a.paused)r.a.currentTime=0;
    this.ramp(r,0,0);
    r.a.play().then(()=>{if(this.cur===r)this.ramp(r,this.vol(),secs);}).catch(()=>{});
  },
  unlock(){
    const c=this.ensureCtx();if(c&&c.state==="suspended")c.resume().catch(()=>{});
    if(!this.unlocked){this.unlocked=true;this.update();}
  }
};

const fx={c:null,ctx:null,ps:[],raf:0,on:false,d:1,
  init(){this.c=document.getElementById("fx");this.ctx=this.c.getContext("2d");window.addEventListener("resize",()=>this.size());this.size();for(let i=0;i<44;i++)this.ps.push(this.mk(true));},
  size(){const d=Math.min(2,window.devicePixelRatio||1);this.d=d;this.c.width=innerWidth*d;this.c.height=innerHeight*d;},
  mk(any){return{x:Math.random(),y:any?Math.random():1.05,r:.6+Math.random()*1.7,s:.00008+Math.random()*.0003,w:Math.random()*6.28,h:Math.random()<.7?"146,232,255":"255,234,176",a:.2+Math.random()*.45};},
  frame(){const {ctx,c}=this;ctx.clearRect(0,0,c.width,c.height);
    for(const p of this.ps){p.y-=p.s*16;p.w+=.008;if(p.y<-.05)Object.assign(p,this.mk(false));
      const x=(p.x+Math.sin(p.w)*.012)*c.width,y=p.y*c.height,r=p.r*this.d*4;
      const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${p.h},${p.a})`);g.addColorStop(1,`rgba(${p.h},0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();}
    this.raf=requestAnimationFrame(()=>this.frame());},
  set(on){let rm=false;try{rm=matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}on=!!on&&!rm;if(!this.ctx||on===this.on)return;this.on=on;
    if(on)this.raf=requestAnimationFrame(()=>this.frame());else{cancelAnimationFrame(this.raf);this.ctx.clearRect(0,0,this.c.width,this.c.height);}}
};

    <textarea id="xout" readonly>${esc(xfer.code)}</textarea>
    <div class="row"><button class="btn sm" data-a="x-copy">Copy code</button>${navigator.share?`<button class="btn ghost sm" data-a="x-share">Share</button>`:""}<button class="btn ghost sm" data-a="x-close">Done</button></div></div>`;

function renderGuide(){

  <dt>The duel</dt><dd>Each side brings five cards. Take turns placing one card on the 3 by 3 board. When a side of your card is higher than the touching side of an opponent's card, that card flips to your colour. A counts as 10.</dd>
  <dt>Scoring</dt><dd>When the board is full, every card in your colour scores a point, plus the card still in hand. The higher score wins.</dd>
  <dt>Cards</dt><dd>Levels 1 to 5 are monsters and 6 to 7 elite monsters. Levels 8 and 9 are the summons of legend, and level 10 holds the legendary heroes. Win them from opponents; bosses and a few others always carry a rare card.</dd>
  <dt>Regions</dt><dd>Each region adds its own rules. Beat its boss to open the next, where opponents play smarter and carry stronger cards.</dd><dt>Free Battle</dt><dd>Choose any difficulty, switch each rule on or off and set the stakes. Higher difficulties bring higher level cards to win. Free battles count toward your record but do not open regions or award rare cards.</dd>

  </dl><div class="row" style="margin-top:12px"><button class="btn ghost" data-a="back">Back</button></div></div>`;

        return `<div class="opp">${ptHTML(o)}<div class="oi"><div class="on">${esc(o.n)}${o.boss?`<span class="boss">Boss</span>`:""}</div>

    }

function finalize(sp,so,forfeit){

  if(m.two){(winner?sfx.win:sfx.draw)();m.phase="done";render();return;}
  (winner==="p"?sfx.win:winner==="o"?sfx.lose:sfx.draw)();
  if(m.trade==="none"){commit(m.origP);return;}
  if(!forfeit&&m.trade==="direct"){commit(possession(m.st,"p"));return;}
  if(!winner){commit(m.origP);return;}
  const n=forfeit?1:m.trade==="one"?1:m.trade==="all"?5:Math.min(5,Math.abs(sp-so));
  if(winner==="p"){
    if(n>=m.origO.length){commit(m.origP.concat(m.origO));return;}
    m.result.pick={n,chosen:[]};render();return;
  }
  const take=m.origP.slice().sort((a,b)=>strength(b.cid)-strength(a.cid)).slice(0,n);

  for(const x of all){
    if(x.origin==="o"&&Ps.has(x.uid)){save.col[x.cid]=(save.col[x.cid]||0)+1;res.gained.push(x.cid);}
    if(x.origin==="p"&&!Ps.has(x.uid)){save.col[x.cid]=(save.col[x.cid]||0)-1;if(save.col[x.cid]<=0)delete save.col[x.cid];res.lost.push(x.cid);}
  }
  const st=save.stats;
  if(res.winner==="p"){st.w++;st.streak=(st.streak||0)+1;st.best=Math.max(st.best||0,st.streak);if(m.free)st.fw=(st.fw||0)+1;else save.beaten[m.opp.id]=(save.beaten[m.opp.id]||0)+1;
    if(!m.free&&m.opp.boss&&m.opp.region+1===save.unlocked&&save.unlocked<REGIONS.length){save.unlocked++;res.unlock=REGIONS[save.unlocked-1].name;}
    if(!m.free&&m.opp.boss&&m.opp.region===REGIONS.length-1&&save.beaten[m.opp.id]===1)res.final=true;}
  else if(res.winner==="o"){st.l++;st.streak=0;if(m.free)st.fl=(st.fl||0)+1;}else st.d++;
  while(totalCards(save.col)<7){const id=ri(11)+(Math.random()<.3?11:0);save.col[id]=(save.col[id]||0)+1;res.gift.push(id);}
  const rw=battleRewards(m,res);res.gil=rw.gil;res.xp=rw.xp;
  save.gil+=rw.gil;st.gilTotal=(st.gilTotal||0)+rw.gil;
  res.ups=gainXP(rw.xp);
  genMerch();
  if(!deckValid(save.deck,save.col))save.deck=autoDeck(save.col);
  m.phase="done";
  autosave();render();
}

const NO_CQ=!(window.CSS&&CSS.supports&&CSS.supports("container-type","inline-size"));

let lastRenderView=null;
function morphNode(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return;}
  if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return;}
  for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);
  for(const at of [...b.attributes])if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
  morphKids(a,b);
}
function morphKids(a,b){
  const ac=[...a.childNodes],bc=[...b.childNodes];
  for(let i=0;i<bc.length;i++){if(i<ac.length)morphNode(ac[i],bc[i]);else a.appendChild(bc[i]);}
  for(let i=bc.length;i<ac.length;i++)ac[i].remove();
}

  pick(d){const p=match.result.pick,k=+d.k,ix=p.chosen.indexOf(k);if(ix>=0)p.chosen.splice(ix,1);else{if(p.chosen.length>=p.n)p.chosen.shift();p.chosen.push(k);}sfx.select();render();},
  "pick-ok"(){const m=match,p=m.result.pick;if(p.chosen.length!==p.n)return;const add=p.chosen.map(k=>m.origO[k]);m.result.pick=null;commit(m.origP.concat(add));},
  "shop-tab"(d){shopTab=d.k;sellArm=null;render();},
  "buy-pack"(d){const p=PACKS.find(x=>x.id===d.k),pr=packPrice(p);if(save.gil<pr)return;save.gil-=pr;const ids=openPack(p),fresh=addCards(ids);sfx.rule();reveal={title:p.n,ids,fresh};autosave();render();},
  "merch-roll"(){if(save.gil<40)return;save.gil-=40;genMerch();autosave();render();toast("The merchant brings out new stock");},
  "buy-card"(d){const k=+d.k,id=save.merch.ids[k];if(save.merch.sold[k])return;const pr=buyPrice(CARDS[id].lv);if(save.gil<pr)return;
    save.gil-=pr;save.merch.sold[k]=true;const fresh=addCards([id]);sfx.select();toast((fresh.length?"New card: ":"Bought ")+CARDS[id].n);autosave();render();},
  sell(d){const id=+d.c;if(totalCards(save.col)<=5||!save.col[id])return;
    if(save.col[id]===1&&sellArm!==id){sellArm=id;render();return;}
    sellArm=null;const pr=sellPrice(CARDS[id].lv);save.col[id]--;if(save.col[id]<=0)delete save.col[id];save.gil+=pr;
    if(!deckValid(save.deck,save.col))save.deck=autoDeck(save.col);toast("Sold "+CARDS[id].n+" for "+fmtG(pr));autosave();render();},
  "reveal-ok"(){reveal=null;render();},
  "cat-lv"(d){const l=+d.l;if(catOpen(l)){catLv=l;render();}},
  "cat-miss"(d){catMissing=d.v==="1";render();},
  "cat-buy"(d){const id=+d.c,c=CARDS[id];if(!catOpen(c.lv)||RARE_SET.has(id))return;const pr=catPrice(c.lv);if(save.gil<pr){toast("Not enough gil. You need "+fmtG(pr)+".");return;}
    save.gil-=pr;const fresh=addCards([id]);sfx.select();toast((fresh.length?"Added to your album: ":"Bought another ")+c.n);autosave();render();},
  "album-buy"(d){const c=CARDS[+d.c];catLv=c.lv;catMissing=true;shopTab="cat";modal=null;go("shop");},
  refine(d){const id=+d.c,c=CARDS[id];if(!has("refine")||(save.col[id]||0)<3||c.lv>=10||totalCards(save.col)<7)return;
    save.col[id]-=3;if(save.col[id]<=0)delete save.col[id];
    const nid=randLv(c.lv+1),fresh=addCards([nid]);
    if(!deckValid(save.deck,save.col))save.deck=autoDeck(save.col);
    modal=null;reveal={title:"Card Refine",ids:[nid],fresh};sfx.rule();autosave();render();},
  async "x-out"(){const obj={k:"ninefold",v:1,at:Date.now(),meta:store.local("meta"),slots:{1:store.local("slot1"),2:store.local("slot2"),3:store.local("slot3")}};
    xfer={mode:"out",code:await packSave(obj)};render();},
  "x-in"(){xfer={mode:"in",text:""};render();setTimeout(()=>{const t=document.getElementById("xin");if(t)t.focus();},50);},
  "x-close"(){xfer=null;render();},
  async "x-copy"(){const code=xfer&&xfer.code;if(!code)return;
    try{await navigator.clipboard.writeText(code);toast("Save code copied");}
    catch(e){const t=document.getElementById("xout");if(t){t.focus();t.select();try{document.execCommand("copy");toast("Save code copied");}catch(e2){toast("Select the code and copy it");}}}},
  "x-share"(){if(xfer&&xfer.code&&navigator.share)navigator.share({title:"Ninefold saves",text:xfer.code}).catch(()=>{});},
  async "x-check"(){try{const o=await unpackSave(xfer.text||"");const n=[1,2,3].filter(k=>o.slots&&o.slots[k]).map(k=>o.slots[k].name);
      xfer.data=o;xfer.err=null;xfer.ready=n.length?n.length+" journey"+(n.length>1?"s":"")+" ("+n.map(esc).join(", ")+")":"no journeys (empty slots)";}
    catch(e){xfer.err=e===1?"This browser can't read compressed codes. Update iOS or try another browser.":"That doesn't look like a Ninefold save code.";xfer.ready=null;}
    render();},
  "x-apply"(){const o=xfer&&xfer.data;if(!o)return;
    if(o.meta)store.put("meta",o.meta);
    for(const n of [1,2,3])store.put("slot"+n,o.slots&&o.slots[n]?normalize(o.slots[n]):null);
    bootLocal();applyOptions();save=null;match=null;dirty=false;activeSlot=0;xfer=null;go("title");toast("Saves imported");},
  rewind(){const m=match;if(!m||m.busy||m.phase!=="play"||m.st.turn!=="p"||!m.hist||m.rewound||!has("rewind"))return;
    m.st=m.hist;m.hist=null;m.rewound=true;m.sel=null;m.pend=null;render();toast("Rewound to your last turn");},

};
const QUIET=new Set(["hand","cell","pick"]);
app.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t||t.disabled)return;
  if(t.dataset.a==="close"&&e.target.closest("[data-stop]")&&!e.target.closest("button[data-a=close]"))return;
  if(!QUIET.has(t.dataset.a))sfx.tick();
  const f=H[t.dataset.a];if(f)f(t.dataset,t);
});
app.addEventListener("input",e=>{if(e.target.id==="nm")newName=e.target.value;if(e.target.id==="xin"&&xfer){xfer.text=e.target.value;if(xfer.ready||xfer.err){xfer.ready=null;xfer.err=null;}}});
app.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-a][role=button]")){e.preventDefault();e.target.click();}
  if(e.key==="Enter"&&e.target.id==="nm"){e.preventDefault();H["ng-start"]();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(reveal){reveal=null;render();}else if(modal!=null){modal=null;render();}else if(match&&match.menu){match.menu=false;render();}}});

/* ================= OFFLINE & SAVE TRANSFER ================= */
let xfer=null;
const b64e=u8=>{let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function packSave(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){try{const buf=await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();return "NF1."+b64e(new Uint8Array(buf));}catch(e){}}
  return "NF0."+b64e(raw);
}
async function unpackSave(code){
  const m=/^NF([01])\.([A-Za-z0-9+/=]+)$/.exec(String(code).replace(/\s+/g,""));if(!m)throw 0;
  let u8;try{u8=b64d(m[2]);}catch(e){throw 0;}
  if(m[1]==="1"){if(!window.DecompressionStream)throw 1;try{u8=new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());}catch(e){throw 0;}}
  let o;try{o=JSON.parse(new TextDecoder().decode(u8));}catch(e){throw 0;}
  if(!o||o.k!=="ninefold"||!o.slots)throw 0;return o;
}
const PWA={
  reg:null,waiting:null,reloading:false,st:null,polling:false,
  ok:"serviceWorker" in navigator&&window.isSecureContext,
  standalone(){return navigator.standalone===true||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);},
  init(){
    if(!this.ok)return;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(this.reloading)location.reload();});
    // hook the registration even when the app was opened offline (register() then fails)
    const hook=reg=>{
      if(!reg||this.reg===reg)return;this.reg=reg;
      if(reg.waiting&&navigator.serviceWorker.controller)this.offer(reg.waiting);
      reg.addEventListener("updatefound",()=>{const w=reg.installing;if(!w)return;
        w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)this.offer(w);if(w.state==="activated"&&view==="options")this.paint();});});
    };
    navigator.serviceWorker.register("sw.js").then(hook).catch(()=>{});
    navigator.serviceWorker.getRegistration().then(hook).catch(()=>{});
    const check=()=>{if(this.reg)this.reg.update().catch(()=>{});};
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")check();});
    window.addEventListener("online",check);
    document.getElementById("updbar").addEventListener("click",()=>this.apply());
  },
  offer(w){this.waiting=w;this.bar();},
  bar(){const b=document.getElementById("updbar");if(b)b.hidden=!(this.waiting&&view!=="match");},
  apply(){
    if(!this.waiting)return;
    if(save&&dirty){toast("Save your game first, then tap Update",2600);return;}
    this.reloading=true;this.waiting.postMessage("skip");
  },
  line(){
    if(!this.ok)return "Offline play works on the online version of the game.";
    const s=this.st;if(!s)return "Checking…";
    if(s.none)return "Preparing the offline copy…";
    const [g,gt]=s.game,[i,it]=s.images,[m,mt]=s.music;
    const done=g>=gt&&i>=it&&m>=mt;
    return done?`<b>Ready.</b> The game, ${it} card images and ${mt} music track${mt===1?"":"s"} are stored on this device.`
      :`Downloading for offline play… ${i}/${it} images, ${m}/${mt} music tracks.`;
  },
  async paint(){
    if(!this.ok)return;
    const ctl=navigator.serviceWorker.controller;
    if(!ctl){this.st={none:true};}
    else this.st=await new Promise(res=>{const ch=new MessageChannel();const t=setTimeout(()=>res(this.st),1500);ch.port1.onmessage=e=>{clearTimeout(t);res(e.data);};ctl.postMessage("status",[ch.port2]);});
    const el=document.getElementById("offst");if(el)el.innerHTML=this.line();
    const s=this.st,pending=!s||s.none||s.game[0]<s.game[1]||s.images[0]<s.images[1]||s.music[0]<s.music[1];
    if(pending&&!this.polling){this.polling=true;setTimeout(()=>{this.polling=false;if(view==="options")this.paint();},2000);}
  }
};

/* ================= BOOT ================= */
PWA.init();
bootLocal();
fx.init();applyOptions();
render();

})();
