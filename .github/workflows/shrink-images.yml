name: Prepare images, music and offline files

# Runs whenever game files change on main:
# - converts PNG and WebP card images and opponent portraits to JPEG and shrinks large ones
# - compresses music and converts WAV/M4A to MP3
# - refreshes the offline file list in sw.js (this triggers "New version available")
on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "music/**"
      - "index.html"
      - "fonts/**"
      - "icons/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shrink large images
        run: |
          pip install --quiet pillow
          python scripts/shrink_images.py

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Compress music and refresh offline list
        run: python scripts/build_offline.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images music index.html sw.js
          if git diff --cached --quiet; then
            echo "Nothing to update"
          else
            git commit -m "Prepare images, music and offline files"
            git push
          fi
